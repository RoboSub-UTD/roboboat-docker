########################################
# Docker Compose File for UTD Roboboat #
########################################
#
# Usage:
# - To build the images:
#     `docker compose build`
# - To start up a specific service detatched:
#     `docker compose up -d <service_name>`
# - To open an attach to a running service:
#     `docker compose attach <service_name>`
#
##########################################################

services:
  development:
    image: utdrobosub/roboboat:development
    build:
      context: .
      dockerfile: Docker/Dockerfile
      target: development
      platforms:
        - 'linux/amd64'
        # - 'linux/arm64'
    # Interactive shell
    tty: True
    stdin_open: True
    privileged: True
    # Networking and IPC for ROS 2
    network_mode: host
    ipc: host
    environment:
      # Allows graphical programs in the container.
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    device_cgroup_rules:
      - "c 189:* rmw"
    volumes:
      # Allows graphical programs in the container.
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-$HOME/.Xauthority}:/root/.Xauthority
      # Access to all Host Devices
      - /dev:/dev
      # Share config / src Directories
      - ./.config:/root/.config
  healthcheck:
    extends: development
    tty: False
    stdin_open: False
    command: ros2 doctor

  # ZED ROS 2 wrapper in ZED SDK *simulation mode*, fed by the virtual ZED 2 in the Unity
  # simulator (crane_sim, ZedSimCamera on Blastoise). Separate image (Docker/Dockerfile.zed):
  # the development image is left untouched. Host networking is required: the stream is RTP/UDP
  # from Unity on the host to 127.0.0.1:30000.
  # This is the only service that needs an NVIDIA GPU + the NVIDIA Container Toolkit.
  zed-sim:
    image: utdrobosub/roboboat:zed-sim
    build:
      context: .
      dockerfile: Docker/Dockerfile.zed
    network_mode: host
    ipc: host
    # NVidia Runtime (required: the ZED SDK is CUDA-only)
    runtime: nvidia
    environment:
      - NVIDIA_DRIVER_CAPABILITIES=all
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      # The SDK parses calibration files with the C locale ("Invalid calibration file format" otherwise).
      - LC_ALL=C
    volumes:
      # Caches the one-time TensorRT optimization of the NEURAL depth model (takes minutes).
      - zed_ai_models:/usr/local/zed/resources
      # Live copy of the parameter overrides: edit + `docker compose restart zed-sim`, no rebuild.
      - ./Docker/zed/zed_sim_override.yaml:/root/zed_sim_override.yaml:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # Automatically opens the zed camera 
    command: >
      ros2 launch zed_wrapper zed_camera.launch.py
      camera_model:=zed2 camera_name:=zed
      sim_mode:=true sim_address:=127.0.0.1 sim_port:=30000
      use_sim_time:=true
      ros_params_override_path:=/root/zed_sim_override.yaml

volumes:
  zed_ai_models:
