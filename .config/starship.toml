format = """
[┌](fg:bold white)\
[](green)\
($username$hostname)\
[](green)[──](bold white)\
$directory$fill\
($container[──](bold white))\
($git_branch$git_status[──](bold white))\
($status[──](bold white))\
($cmd_duration[──](bold white))[](bold white)
[└─](fg:bold white)󰛿 \
"""

continuation_prompt = '󰷫 '

# Disable the blank line at the start of the prompt
# add_newline = false

[profiles]
transient = """[┌](bold white)$fill($cmd_duration[──](bold white))[](bold white)\n[└─](bold white)󰛿 """

[fill]
symbol = "─"
style = "bold white"

[username]
show_always = true
style_user  = "bg:green bold black"
style_root  = "bg:green bold red"
format      = '[$user]($style)'

[hostname]
style      = "bg:green bold black"
ssh_only   = false
ssh_symbol = "/ "
format     = '[@$hostname$ssh_symbol](bold black bg:green)'
trim_at    = '.companyname.com'
disabled   = false

[directory]
style             = "bg:blue bold black"
format            = "[](blue)[$path]($style)[](blue)"
truncation_length = 3
truncation_symbol = " /"
read_only         = "󰌾"

[directory.substitutions]
"~" = " "
"Documents" = "󰈙 "
"Downloads" = " "
"Music"     = " "
"Pictures"  = " "
"Videos"  = " "

[container]
style = "bg:blue bold black"
format = '[](blue)[$symbol \[$name\]]($style)[](blue)'

# Here is how you can shorten some long paths by text replacement
# similar to mapped_locations in Oh My Posh:
[git_branch]
style  = "bg:purple bold black"
format = "[](purple)[$symbol$branch(:$remote_branch)]($style)"
symbol = " "

[git_status]
style = "bg:purple bold black"
format = '([\[ $all_status$ahead_behind\]]($style))[](purple)'

[cmd_duration]
min_time = 250
style = "bg:yellow bold black"
format = "[](yellow)[$duration]($style)[](yellow)"

[status]
disabled = false
symbol = " "
style = "bg:red bold black"
format = "[](red)[$symbol]($style)[](red)"

