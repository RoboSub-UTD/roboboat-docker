name: Docker Image Build and Push

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'Docker/Dockerfile'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'Docker/Dockerfile'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Login to Dockerhub
      run: docker login --username ${{ DOCKERHUB_USERNAME }} --password ${{ secrets.DOCKERHUB_PASSWORD }}
    - name: Build and Push Docker Image
      run: docker compose build --push
